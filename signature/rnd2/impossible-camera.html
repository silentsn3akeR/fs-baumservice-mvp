<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>RND D — Impossible Camera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { --ink:#26242e; --leaf:#b5d36e; --paper:#edecef; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--ink); overflow:hidden; font-family:Archivo,sans-serif; }
  .vp { position:fixed; inset:0; perspective:850px; perspective-origin:50% 42%; }

  /* AKT 1 — Foto-Raum (Registrierungs-Rig) */
  .world { position:absolute; inset:0; transform-style:preserve-3d;
    transition: transform 3.4s cubic-bezier(.55,.06,.22,1), opacity .5s ease .1s, filter .55s ease; }
  .plane { position:absolute; inset:0; }
  .plane img { width:100%; height:100%; object-fit:cover; object-position:50% 32%; }
  .p-bg     { transform: translateZ(-450px) scale(1.5); }
  .p-human  { transform: translateZ(-160px) scale(1.178); }
  .p-trunkR { transform: translateZ(200px)  scale(0.778); }
  .p-trunkL { transform: translateZ(330px)  scale(0.633); }
  .go .world { transform: translate3d(-62px, 34px, 585px) rotateY(2.5deg); }
  .whip .world { filter: blur(13px) brightness(1.15); opacity:0; }

  /* AKT 2 — Video-Raum (POV) + Frozen-Time-Rig */
  .vrig { position:absolute; inset:0; transform-style:preserve-3d; opacity:0;
    transition: transform 2.6s cubic-bezier(.3,.6,.2,1), opacity .45s ease; }
  .vrig video, .vrig .boots { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .vrig video { transform: scale(1.28); transition: transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .live .vrig { opacity:1; }
  .live .vrig video { transform: scale(1); }
  .boots { opacity:0; transform: translateZ(70px) scale(0.918); transition: opacity .3s ease; }
  /* ZEIT STEHT — KAMERA FLIEGT WEITER */
  .frozen .vrig { transform: rotateY(6.5deg) translate3d(-26px, 6px, 95px); }
  .frozen .boots { opacity:1; }
  .frozen .vig { opacity:1; }
  .vig { position:absolute; inset:0; opacity:0; transition:opacity .8s ease; pointer-events:none;
    background: radial-gradient(58% 58% at 50% 46%, transparent 55%, rgba(38,36,46,.72) 100%); }

  .bracket { position:fixed; left:38%; top:52%; width:9rem; height:9rem; opacity:0; z-index:6;
    transition: opacity .35s ease, transform .5s cubic-bezier(.2,1.4,.4,1); transform:scale(1.4); }
  .bracket::before,.bracket::after { content:""; position:absolute; top:0; bottom:0; width:1.6rem; border:3px solid var(--leaf); }
  .bracket::before { left:0; border-right:0; } .bracket::after { right:0; border-left:0; }
  .frozen .bracket { opacity:1; transform:scale(1); }

  .st { position:fixed; left:6vw; bottom:8vh; z-index:7; pointer-events:none; }
  .st span { display:block; color:var(--paper); font-weight:880; font-variation-settings:"wdth" 122;
    text-transform:uppercase; font-size:min(5.6vw,4.4rem); line-height:.95; opacity:0; transform:translateY(56px);
    transition:opacity .45s ease, transform .6s cubic-bezier(.16,.84,.24,1); }
  .st .b { color:var(--leaf); transition-delay:.1s; }
  .frozen .st span { opacity:1; transform:none; }

  .veil { position:fixed; inset:0; background:var(--ink); opacity:1; transition:opacity .8s ease; pointer-events:none; z-index:9; }
  .on .veil { opacity:0; }
  .tag { position:fixed; left:1.2rem; top:1rem; color:var(--paper); font-family:"IBM Plex Mono",monospace;
    font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; opacity:.75; z-index:10; }
  .tag b { color:var(--leaf); font-weight:500; }

  @media (prefers-reduced-motion: reduce) {
    .world { display:none; }
    .vrig { opacity:1; } .vrig video { transform:none; }
    .bracket, .st span { opacity:1; transform:none; } .veil { opacity:0; }
  }
</style>
</head>
<body>
<p class="tag">[ FS ] RND-D · <b>IMPOSSIBLE CAMERA</b> · Ein Take: Foto → Video → gefrorene Zeit</p>
<div class="vp">
  <div class="world" id="w">
    <div class="plane p-bg"><img src="/media/M-01__hero__1920.jpg" alt=""></div>
    <div class="plane p-human"><img src="/media/M-01__climber__1440.webp" alt=""></div>
    <div class="plane p-trunkR"><img src="/media/M-01__trunkR__1440.webp" alt=""></div>
    <div class="plane p-trunkL"><img src="/media/M-01__trunkL__1440.webp" alt=""></div>
  </div>
  <div class="vrig" id="vr">
    <video id="v" src="/media/V-06__pov-loop.mp4" muted playsinline preload="auto"></video>
    <img class="boots" src="/media/V-06__bootspunch__720.webp" alt="">
    <div class="vig"></div>
  </div>
</div>
<span class="bracket"></span>
<div class="st"><span class="a">Zeit steht.</span><span class="b">Wir nicht.</span></div>
<div class="veil"></div>
<script>
(function () {
  var b = document.body, v = document.getElementById('v'), vr = document.getElementById('vr');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { v.currentTime = 5.2; return; }
  var timers = [];
  function at(t, fn) { timers.push(setTimeout(fn, t)); }
  function run() {
    timers.forEach(clearTimeout); timers = [];
    b.className = '';
    v.pause(); v.currentTime = 1.6;
    void b.offsetWidth;
    at(60,   function () { b.classList.add('on'); });          // Veil auf
    at(1100, function () { b.classList.add('go'); });          // DIVE durch die Staemme
    at(4150, function () { b.classList.add('whip'); v.play(); });  // Whip-Cut: Foto -> POV-Video
    at(4350, function () { b.classList.add('live'); });
    at(7600, function () { v.pause(); v.currentTime = 5.2; b.classList.add('frozen'); });   // ZEIT FRIERT exakt auf Cutout-Frame
    at(10400,function () { b.classList.remove('frozen'); v.play(); }); // Zeit laeuft wieder
    at(12300,function () { b.classList.remove('on'); });       // Exit
    at(13400, run);                                            // Loop
  }
  addEventListener('pointermove', function (e) {
    if (!b.classList.contains('frozen')) return;
    var ry = 6.5 + (e.clientX / innerWidth - .5) * 7;
    var rx = (e.clientY / innerHeight - .5) * -4;
    vr.style.transition = 'transform .35s ease-out';
    vr.style.transform = 'rotateY(' + ry + 'deg) rotateX(' + rx + 'deg) translate3d(-26px, 6px, 95px)';
  }, { passive: true });
  addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
