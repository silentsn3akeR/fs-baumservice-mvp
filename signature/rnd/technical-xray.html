<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RND C — Technical X-Ray</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { --ink:#26242e; --leaf:#b5d36e; --paper:#edecef; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--ink); overflow:hidden; font-family:Archivo,sans-serif; }
  .vp { position:fixed; inset:0; perspective:1100px; }
  .world { position:absolute; inset:0; transform-style:preserve-3d; animation: sway 16s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotateY(-1.2deg); } 50% { transform: rotateY(1.6deg) rotateX(.6deg); } }
  .layer { position:absolute; inset:0; }
  .layer img { width:100%; height:100%; object-fit:cover; object-position:50% 32%; }

  /* 16s-Zyklus: REALITAET(0-12%) -> DRAIN(12-30) -> X-RAY-WELT(30-62) -> REBUILD(62-80) -> REALITAET */
  .l-photo   { animation: photo 16s ease-in-out infinite; }
  .l-human   { transform: translateZ(40px) scale(0.964); animation: humanx 16s ease-in-out infinite; }
  .l-contour { animation: contour 16s ease-in-out infinite; opacity:0;
    filter: drop-shadow(0 0 6px rgba(181,211,110,.35)); transform: translateZ(20px) scale(0.982); }
  .l-contour img { object-fit:cover; }
  @keyframes photo {
    0%,12%  { filter:none; opacity:1; }
    26%     { filter: grayscale(1) brightness(.42); opacity:.9; }
    34%,58% { filter: grayscale(1) brightness(.16); opacity:.55; }
    72%,100%{ filter:none; opacity:1; }
  }
  @keyframes humanx {
    0%,14%  { filter:none; opacity:1; }
    34%,58% { filter: grayscale(.2) brightness(1.06) contrast(1.05); opacity:1; }
    74%,100%{ filter:none; }
  }
  @keyframes contour {
    0%,16%  { opacity:0; transform: translateZ(20px) scale(1.03); }
    34%,58% { opacity:1; transform: translateZ(20px) scale(0.982); }
    70%,100%{ opacity:0; }
  }

  /* Arbeitsraum-Geometrie: Klammer + Radius aus der echten Kletterposition */
  .geo { position:absolute; left:38%; top:20%; width:24vw; height:24vw; opacity:0; transform:scale(1.3);
    animation: geo 16s cubic-bezier(.2,.9,.3,1.1) infinite; }
  @keyframes geo { 0%,30% {opacity:0; transform:scale(1.3)} 38%,58% {opacity:1; transform:scale(1)} 66%,100% {opacity:0} }
  .geo .b { position:absolute; inset:0; }
  .geo .b::before,.geo .b::after { content:""; position:absolute; top:0; bottom:0; width:2rem; border:3px solid var(--leaf); }
  .geo .b::before { left:0; border-right:0; } .geo .b::after { right:0; border-left:0; }
  .geo .r { position:absolute; inset:12%; border:1.5px dashed rgba(181,211,110,.8); border-radius:50%; }
  .geo em { position:absolute; left:50%; bottom:-2.2rem; translate:-50% 0; font-style:normal; white-space:nowrap;
    color:var(--paper); font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.24em; }
  .geo em b { color:var(--leaf); font-weight:500; }

  .statement { position:fixed; left:6vw; bottom:8vh; z-index:6; pointer-events:none; }
  .statement span { display:block; color:var(--paper); font-weight:880; font-variation-settings:"wdth" 122;
    text-transform:uppercase; font-size:min(6.4vw,5rem); line-height:.95; opacity:0;
    animation: st 16s ease infinite; }
  .statement .s2 { color:var(--leaf); animation-name: st2; }
  @keyframes st  { 0%,34% {opacity:0; transform:translateY(70px)} 42%,60% {opacity:1; transform:none} 68%,100% {opacity:0} }
  @keyframes st2 { 0%,37% {opacity:0; transform:translateY(70px)} 45%,60% {opacity:1; transform:none} 68%,100% {opacity:0} }

  .tag { position:fixed; left:1.2rem; top:1rem; color:var(--paper); font-family:"IBM Plex Mono",monospace;
    font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; opacity:.75; z-index:9; }
  .tag b { color:var(--leaf); font-weight:500; }

  @media (prefers-reduced-motion: reduce) {
    .world,.l-photo,.l-human,.l-contour,.geo,.statement span { animation:none !important; }
    .l-photo { filter: grayscale(1) brightness(.16); opacity:.55; }
    .l-contour,.geo,.statement span { opacity:1; transform:none; }
  }
</style>
</head>
<body>
<p class="tag">[ FS ] RND-C · <b>TECHNICAL X-RAY</b> · Konturwelt real aus dem Einsatzfoto abgeleitet</p>
<div class="vp">
  <div class="world">
    <div class="layer l-photo"><img src="/media/M-01__hero__1920.jpg" alt=""></div>
    <div class="layer l-contour"><img src="/rnd/assets/xray_contour.webp" alt=""></div>
    <div class="layer l-human"><img src="/media/M-01__climber__1440.webp" alt=""></div>
    <div class="geo"><span class="b"></span><span class="r"></span><em>ARBEITSRAUM · <b>GESICHERT AM DOPPELSEIL</b></em></div>
  </div>
</div>
<div class="statement"><span class="s1">So lesen wir</span><span class="s2">einen Baum.</span></div>
</body>
</html>
