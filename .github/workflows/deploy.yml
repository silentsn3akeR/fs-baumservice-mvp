name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FS Signature-Site: zero-dependency static build (Node-Stdlib, kein npm install).
      # Medien-Derivate und Schriften sind versionierte Release-Assets im Repo.
      - name: Build signature production site
        run: node signature/build.mjs
        env:
          FS_RELEASE: '1'
          PUBLIC_BASE: /fs-baumservice-mvp/
          SITE_ORIGIN: https://silentsn3akeR.github.io

      # Release-Gate: Artefakt-Bytes pruefen, laut scheitern statt still deployen.
      - name: Audit built artifact
        run: |
          set -eu
          d=signature/dist
          test -f "$d/index.html" && test -f "$d/site.css" && test -f "$d/robots.txt" && test -f "$d/sitemap.xml"
          test -f "$d/fonts/archivo-latin-var.woff2"
          routes=$(find "$d" -name index.html | wc -l); echo "routes=$routes"
          test "$routes" -eq 15
          ! grep -rIl "noindex" "$d" || { echo "FAIL: noindex in release"; exit 1; }
          ! grep -rIl "0173 346 3959" "$d" || { echo "FAIL: old phone in release"; exit 1; }
          ! grep -rIl "fonts.googleapis.com\|fonts.gstatic.com" "$d" || { echo "FAIL: external fonts"; exit 1; }
          ! test -e "$d/rnd" && ! test -e "$d/rnd2" || { echo "FAIL: rnd exposed"; exit 1; }

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: signature/dist
          force_orphan: true
          commit_message: 'Deploy [skip ci]'
